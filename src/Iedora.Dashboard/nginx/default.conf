server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe for kamal-proxy (mirrors the API's /up contract).
    location = /up {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Fingerprinted framework assets are immutable — cache hard.
    location /_framework/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: real files are served; every unknown route gets the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell + runtime config must not be cached, so a redeploy is picked up at once.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /appsettings.json { add_header Cache-Control "no-cache"; }
}
