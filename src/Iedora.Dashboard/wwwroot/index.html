<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iedora admin</title>
    <base href="/" />
    <!-- MudBlazor design system: Roboto (its Material default) + component styles. -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- ?v bust: app.css isn't fingerprinted, and Cloudflare caches it by extension — so a CSS change
         is masked at the edge until TTL. index.html is served no-cache, so bumping this version forces
         a fresh fetch. Bump it whenever app.css changes (or add a Cloudflare cache rule for the host). -->
    <link rel="stylesheet" href="app.css?v=5" />
    <link href="Iedora.Dashboard.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- Boot splash shown while the WASM runtime downloads, before Blazor takes over #app. Reuses
             MudBlazor's own spinner markup + animation (MudBlazor.min.css is loaded first in <head>);
             the color is hard-set to MudBlazor's default primary because the theme palette variables
             aren't available until MudThemeProvider renders post-boot. -->
        <div class="app-loading">
            <div role="progressbar" aria-label="Loading" style="color:#594AE2"
                 class="mud-progress-circular mud-progress-medium mud-progress-indeterminate">
                <svg class="mud-progress-circular-svg" viewBox="22.5 22.5 43 43">
                    <circle class="mud-progress-circular-circle mud-progress-indeterminate"
                            cx="44" cy="44" r="20" fill="none" stroke-width="3"></circle>
                </svg>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Fingerprint placeholder: OverrideHtmlAssetPlaceholders (csproj) rewrites this to the hashed
         filename at publish, so the bootstrapper resolves on a static host (a plain <script src> isn't
         remapped by the importmap). Without it, published static hosting 404s and the app never boots. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
