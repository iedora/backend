<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iedora admin</title>
    <base href="/" />
    <!-- MudBlazor design system: Roboto (its Material default) + component styles. -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- ?v bust: app.css isn't fingerprinted, and Cloudflare caches it by extension — so a CSS change
         is masked at the edge until TTL. index.html is served no-cache, so bumping this version forces
         a fresh fetch. Bump it whenever app.css changes (or add a Cloudflare cache rule for the host). -->
    <link rel="stylesheet" href="app.css?v=3" />
    <link href="Iedora.Dashboard.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="booting">Loading…</div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Fingerprint placeholder: OverrideHtmlAssetPlaceholders (csproj) rewrites this to the hashed
         filename at publish, so the bootstrapper resolves on a static host (a plain <script src> isn't
         remapped by the importmap). Without it, published static hosting 404s and the app never boots. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
